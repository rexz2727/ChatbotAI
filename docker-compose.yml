services:
  chromadb:
    image: docker.io/chromadb/chroma:latest
    container_name: chatbot-chromadb
    ports:
      - "${CHROMA_BIND_IP:-127.0.0.1}:${CHROMA_PORT:-8000}:8000"
    environment:
      - ANONYMIZED_TELEMETRY=False
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
    volumes:
      - chroma-data:/data
    healthcheck:
      test: bash -c "exec 3<>/dev/tcp/localhost/8000"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  chatbot:
    build: .
    container_name: chatbot-app
    ports:
      - "${CHATBOT_BIND_IP:-127.0.0.1}:${PORT:-3000}:3000"
    environment:
      # Overrides .env: inside Docker the app must bind to 0.0.0.0, not 127.0.0.1
      - HOST=0.0.0.0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - SQLITE_DB_PATH=/app/data/database.db
    env_file:
      - .env
    volumes:
      - sqlite-data:/app/data
      - ./src:/app/src
      - ./public:/app/public
    depends_on:
      chromadb:
        condition: service_healthy
    restart: always

  admin:
    build: .
    container_name: chatbot-admin
    pid: "host"
    command: node src/admin.js
    ports:
      - "192.168.1.100:3001:3001"   # LAN - máy chính
      - "100.88.116.97:3001:3001"    # Tailscale - laptop
    env_file:
      - .env
    environment:
      - SQLITE_DB_PATH=/app/data/database.db
    volumes:
      - sqlite-data:/app/data
      - ./src:/app/src
      - ./public:/app/public
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
    group_add:
      - "0"
    restart: always

volumes:
  chroma-data:
  sqlite-data:
