<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Công an Phường Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap">
    <form id="login-form" class="card login-card">
      <h2 class="login-title"><span class="shield">🛡️</span> CA Phường</h2>
      <p class="login-sub">Hệ thống Quản trị Nội bộ</p>

      <label class="login-label" for="username">Tài khoản</label>
      <input type="text" id="username" class="login-input" autocomplete="username" required>

      <label class="login-label" for="password">Mật khẩu</label>
      <input type="password" id="password" class="login-input" autocomplete="current-password" required>

      <p id="login-error" class="login-error" style="display:none;">Tài khoản hoặc mật khẩu không đúng.</p>

      <button type="submit" class="btn primary login-btn">Đăng nhập</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          window.location = '/';
        } else {
          errorEl.style.display = 'block';
        }
      } catch (err) {
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
